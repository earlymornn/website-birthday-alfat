<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Gift for Alfat</title>

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500&family=Sacramento&display=swap" rel="stylesheet">

    <!-- BOOTSTRAP -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CUSTOM CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="persistent-player">

    <!-- ===================================
         BACKGROUND MUSIC
    =================================== -->

    <audio id="backgroundMusic" loop preload="auto">
        <source
            src="../assets/music/your-song.mp3"
            type="audio/mpeg">
    </audio>


    <!-- ===================================
         WEBSITE PAGES
    =================================== -->

    <iframe
        src="index.html"
        class="persistent-frame"
        name="pageFrame"
        title="Birthday Website for Alfat">
    </iframe>


    <!-- ===================================
         MOCHI COMPANION
    =================================== -->

    <div class="mochi-container">

        <!-- CHAT BUBBLE -->
        <div class="mochi-bubble" id="mochiBubble">
            <p id="mochiMessage">
                Hiii! I'm Mochi ♡
            </p>
        </div>


        
        <button
            class="mochi-character"
            id="mochiCharacter"
            type="button"
            aria-label="Talk to Mochi"
            aria-expanded="false">

            <span class="mochi-ear mochi-ear-left"></span>
            <span class="mochi-ear mochi-ear-right"></span>

            <span class="mochi-head">
                <span class="mochi-eye mochi-eye-left"></span>
                <span class="mochi-eye mochi-eye-right"></span>
                <span class="mochi-nose"></span>
                <span class="mochi-mouth"></span>
                <span class="mochi-cheek mochi-cheek-left"></span>
                <span class="mochi-cheek mochi-cheek-right"></span>
            </span>

            <span class="mochi-bow">
                <span></span>
                <span></span>
            </span>

            <span class="mochi-body">
                <span class="mochi-paw mochi-paw-left"></span>
                <span class="mochi-paw mochi-paw-right"></span>
            </span>
        </button>



        <!-- MOCHI NAME -->
        <button
            type="button"
            class="mochi-name"
            id="openMochiRoom">
            MOCHI ♡
        </button>

    </div>


    <!-- ===================================
         MOCHI'S LITTLE ROOM
         SEPARATE FROM MOCHI CONTAINER
    =================================== -->

    <div class="mochi-room" id="mochiRoom">

        <!-- ROOM HEADER -->
        <div class="room-header">

            <span>MOCHI'S LITTLE ROOM</span>

            <button
                type="button"
                id="closeMochiRoom"
                aria-label="Close room">
                ×
            </button>

        </div>


        <!-- ROOM SCENE -->
        <div class="room-scene">

            <!-- WINDOW -->
            <div class="room-window">
                <span>✦</span>
                <span>☾</span>
                <span>✧</span>
            </div>


            <!-- WALL DECORATION -->
            <div class="room-picture">
                ♡
            </div>


            <!-- BED -->
            <div class="mochi-bed">

                <div class="bed-pillow"></div>

                <div class="bed-blanket"></div>

            </div>


            <!-- FISH TOY -->
            <button
                type="button"
                class="fish-toy"
                id="fishToy"
                aria-label="Play with fish toy">
                🐟
            </button>


            <!-- CARPET -->
            <div class="room-carpet"></div>


            <!-- PLANT -->
            <div class="room-plant">
                🌷
            </div>

        </div>


        <!-- ROOM FOOTER -->
        <div class="room-footer">

            <p id="roomMessage">
                Welcome to my little room ♡
            </p>

        </div>

    </div>


    <!-- ===================================
         PLAYER SCRIPT
    =================================== -->

    <script src="../js/player.js"></script>

</body>
</html>
